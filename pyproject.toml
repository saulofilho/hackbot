[project]
name = "hackbot"
version = "0.1.0"
description = "Harness de pentest orquestrado por agente LLM (ReAct + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.40",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
hackbot = "hackbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
