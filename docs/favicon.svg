<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="hackbot">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#05070a"/>
  <!-- CRT bezel -->
  <rect x="8" y="12" width="48" height="36" rx="5" fill="none" stroke="#1f7f4a" stroke-width="2.5"/>
  <!-- screen scanlines -->
  <g opacity="0.25" stroke="#33ff8a" stroke-width="1">
    <line x1="12" y1="18" x2="52" y2="18"/>
    <line x1="12" y1="24" x2="52" y2="24"/>
    <line x1="12" y1="30" x2="52" y2="30"/>
    <line x1="12" y1="36" x2="52" y2="36"/>
    <line x1="12" y1="42" x2="52" y2="42"/>
  </g>
  <!-- prompt: >_ -->
  <g filter="url(#glow)" fill="none" stroke="#33ff8a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16,24 23,30 16,36"/>
    <line x1="28" y1="38" x2="40" y2="38"/>
  </g>
  <!-- stand -->
  <rect x="26" y="48" width="12" height="4" rx="1" fill="#1f7f4a"/>
  <rect x="20" y="52" width="24" height="3" rx="1.5" fill="#1f7f4a"/>
</svg>
